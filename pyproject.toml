[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-harvester"
version = "0.1.0"
description = "حاصدة ميزان — أداة جمع التشريعات السورية وتصديرها لتطبيق ميزان"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pymupdf>=1.24",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PySide6>=6.6"]
ui = ["PySide6>=6.6"]

[project.scripts]
mizan-harvest = "cli:main"

[tool.setuptools]
py-modules = [
              "answer", "autopilot", "chunker",
              "cli", "community_seed", "config",
              "crawl_queue", "crawler", "database",
              "dedup", "discovery", "engines",
              "exporter", "extractor", "extractor_v4",
              "fetcher", "gap_analysis", "hf_syria_laws",
              "doc_nature", "law_identity", "law_parts", "postprocess", "named_laws", "regulations", "exclusions", "issue_date", "precedent_parser", "precedent_source", "damascusbar_source", "precedent_export", "article_links", "missing_targets", "core_laws", "syrialaw_api", "precedent_syrialaw", "precedent_wp", "precedent_blogger", "bunud_source", "law_status", "learning",
              "logging_setup", "migrations", "mizan_injector",
              "official_seed", "package_manifest", "recon", "homsbar_source", "precedent_pdf",
              "search", "source_matrix", "source_quality",
              "urls", "verify_package", "wayback_source",
              "wipo_source"]
packages = ["app", "app.pages"]

[tool.pytest.ini_options]
markers = [
    "network: اختبارات تحتاج اتصالاً حياً بالإنترنت — مستبعدة افتراضياً",
]
# فصل اختبارات الشبكة عن اختبارات الوحدة (التسليم 1): الافتراضي محلي فقط.
addopts = "-m 'not network'"
