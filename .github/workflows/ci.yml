name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # مكتبات النظام اللازمة لمنصة Qt offscreen (لقطة/فحص الواجهة)
      - name: system deps for Qt offscreen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 libdbus-1-3

      - name: install
        run: pip install -e ".[dev]"

      - name: unit tests (no network)
        run: pytest -q

      - name: CLI smoke
        run: |
          python -m cli init
          python -m cli stats

      - name: GUI smoke (offscreen)
        run: QT_QPA_PLATFORM=offscreen python -m app.main --smoke

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps for Qt offscreen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 libdbus-1-3
      - name: install
        run: pip install -e ".[dev]"
      - name: build frozen bundle + frozen smoke
        run: bash packaging/build_linux.sh
